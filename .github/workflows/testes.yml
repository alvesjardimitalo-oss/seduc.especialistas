name: Testes do SEDUC
on:
  pull_request:
  push:
    branches: [main, feature/mvp-especialistas]
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras de negócio sem dados reais
        run: node --test tests/*.test.mjs
      - name: Verificar sintaxe de JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/validacoes.mjs
