name: Testes SEDUC Especialistas
on:
  push:
    branches: [main, v2-prontuario]
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sintaxe
        run: for f in js/*.js js/paginas/*.js; do node --check "$f"; done
      - name: Regras de negócio
        run: node --test tests/dominio.test.mjs
      - name: Instalar ferramentas de teste
        run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Regras de segurança do Firestore (emulador)
        run: |
          set -o pipefail
          npm run test:regras 2>&1 | tee regras.log || {
            grep -E "^not ok|^# Subtest|Error|expected|PERMISSION|evaluation error|L[0-9]+" regras.log | grep -v "^# Subtest" | head -40 | while IFS= read -r l; do echo "::error title=regras::$l"; done
            exit 1; }
      - name: Interface no navegador (simulador, dados fictícios)
        run: |
          set -o pipefail
          node tests/tela.local.mjs capturas 2>&1 | tee tela.log || { tail -15 tela.log | while IFS= read -r l; do echo "::error title=tela::$l"; done; exit 1; }
      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/
          retention-days: 7
