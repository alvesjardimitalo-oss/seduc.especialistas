name: Testes do SEDUC
on:
  pull_request:
  push:
    branches: [main, feature/mvp-especialistas]
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe de JavaScript
        run: |
          node --check assets/js/evolucao.mjs
          node --check assets/js/aluno-historico.mjs
          node --check assets/js/relatorios.mjs
          node --check assets/js/app.js
          node --check assets/js/validacoes.mjs
          node --check assets/js/importacao-servidores.mjs
          node --check assets/js/profissionais-visao.mjs
          node --check tests/firestore.rules.test.mjs
      - name: Validar regras de negócio
        run: node --test tests/agendamento-interface.test.mjs tests/validacoes.test.mjs tests/firebase-config.test.mjs tests/importacao-servidores.test.mjs tests/importacao-alunos.test.mjs tests/profissionais-visao.test.mjs tests/relatorios.test.mjs tests/aluno-historico.test.mjs tests/evolucao.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar ferramentas de testes Firebase
        run: npm install --no-audit --no-fund
      - name: Testar permissões do Firestore no emulador
        run: npm run test:rules
