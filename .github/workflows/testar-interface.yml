name: Testar interface publicada no navegador
on:
  push:
    branches: [feature/mvp-especialistas]
  workflow_dispatch:
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Testar carregamento real do SEDUC
        run: node tests/interface-publicada.mjs
