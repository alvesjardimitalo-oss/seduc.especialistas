name: Verificar site e Firebase do SEDUC
on:
  push:
    branches: [feature/mvp-especialistas]
  workflow_dispatch:
jobs:
  integracao:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir GitHub Pages e Firebase Authentication sem dados pessoais
        run: node tests/saude-publicacao.mjs
