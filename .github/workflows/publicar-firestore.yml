name: Publicar regras do Firestore SEDUC
# Automático: todo push na v2-prontuario que mude as regras ou os índices publica sozinho,
# depois de passar nos testes do emulador. Também pode ser rodado à mão em Actions.
on:
  push:
    branches: [v2-prontuario]
    paths: [firestore.rules, firestore.indexes.json, .github/workflows/publicar-firestore.yml]
  workflow_dispatch:
    inputs:
      confirmar_projeto:
        description: "Digite seduc-especialistas para autorizar a publicação de regras"
        type: string
        required: true
jobs:
  publicar:
    if: ${{ github.event_name == 'push' || inputs.confirmar_projeto == 'seduc-especialistas' }}
    runs-on: ubuntu-latest
    concurrency:
      group: seduc-firestore-rules-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Conferir conta de serviço configurada
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEDUC }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT_SEDUC. Veja o passo a passo em docs/IMPLANTACAO.md (seção 'Conectar o GitHub ao Firebase')."
            exit 1
          fi
      - name: Carregar código e regras revisadas
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências reprodutíveis
        run: npm install --no-audit --no-fund
      - name: Testar regras de segurança no emulador
        run: npm run test:regras
      - name: Autenticar no Firebase (conta de serviço)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEDUC }}
      - name: Publicar regras e índices do Firestore
        run: npx --no-install firebase deploy --only firestore:rules,firestore:indexes --project seduc-especialistas --non-interactive
