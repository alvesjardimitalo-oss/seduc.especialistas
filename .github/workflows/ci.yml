name: Verificar SEDUC
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm test
      - run: npm run build
      - run: npx firebase emulators:exec --only firestore --project demo-seduc "node scripts/test-firestore.mjs"
      - run: npx firebase emulators:exec --only auth,firestore --project demo-seduc-tests "node tests/equipe-auth.integration.mjs"
